<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Ledger</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--line:#dfe5e2;--fg:#15201b;--muted:#5d6b64;--in:#0f8a5f;--out:#c2452d;--acc:#1f6f5c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#15201c;--line:#26342f;--fg:#e6efeb;--muted:#93a39c;--in:#3fcf95;--out:#ff7c63;--acc:#58c4a6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px}
.app{max-width:520px;margin:0 auto;display:grid;gap:14px}
h1{font-size:20px;margin:0}
.bal{background:var(--acc);color:#fff;border-radius:18px;padding:18px;display:grid;gap:10px}
.bal .big{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.row span{opacity:.85;font-size:13px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
form .full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
input,select{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;padding:9px;font:inherit;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.add{border:0;border-radius:9px;padding:11px;font:600 15px system-ui;background:var(--fg);color:var(--bg);cursor:pointer}
.bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--out);border-radius:9px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
li:first-child{border-top:0}
li small{color:var(--muted);display:block}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><h1>Pocket Ledger</h1><button class="del" id="reset" title="Reset sample data">Reset</button></div>
  <div class="bal">
    <span style="font-size:13px;opacity:.85">Balance this month</span>
    <div class="big" id="balance">৳0</div>
    <div class="row"><div><span>Income</span><br><b id="inc">৳0</b></div><div><span>Spent</span><br><b id="exp">৳0</b></div></div>
  </div>
  <form id="f">
    <div class="seg full" role="group" aria-label="Type"><button type="button" class="on" data-t="out">Expense</button><button type="button" data-t="in">Income</button></div>
    <label class="full">What for<input id="note" required placeholder="e.g. Rickshaw to college"></label>
    <label>Amount (৳)<input id="amount" type="number" min="1" step="1" required placeholder="120"></label>
    <label>Category<select id="cat"><option>Food</option><option>Transport</option><option>Study</option><option>Bills</option><option>Fun</option><option>Salary</option><option>Freelance</option></select></label>
    <button class="add full">Add entry</button>
  </form>
  <div class="bars" id="bars"></div>
  <ul id="list"></ul>
  <p class="muted">Web port of the companion app from my Dart &amp; Flutter book. Data stays in your browser.</p>
</div>
<script>
const KEY="pocket-ledger-v1";
const SAMPLE=[{t:"in",note:"Freelance app fix",amount:4000,cat:"Freelance"},{t:"out",note:"Flutter course books",amount:650,cat:"Study"},{t:"out",note:"Kacchi with friends",amount:420,cat:"Food"},{t:"out",note:"Internet bill",amount:800,cat:"Bills"},{t:"out",note:"Bus to Mirpur",amount:60,cat:"Transport"}].map((e,i)=>({...e,id:i+1,at:Date.now()-i*86400000}));
let items; try{items=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!Array.isArray(items)) items=SAMPLE.slice();
let type="out";
const tk=n=>"৳"+n.toLocaleString("en-IN");
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function draw(){
  const inc=items.filter(e=>e.t==="in").reduce((a,e)=>a+e.amount,0), exp=items.filter(e=>e.t==="out").reduce((a,e)=>a+e.amount,0);
  balance.textContent=tk(inc-exp); document.getElementById("inc").textContent=tk(inc); document.getElementById("exp").textContent=tk(exp);
  const by={}; items.filter(e=>e.t==="out").forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const max=Math.max(1,...Object.values(by));
  bars.innerHTML="<b style='font-size:13px'>Spending by category</b>"+(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${c}</span><div class="track"><i style="width:${v/max*100}%"></i></div><span style="text-align:right">${tk(v)}</span></div>`).join("")||"<span class='muted'>No expenses yet.</span>");
  list.innerHTML=items.slice().sort((a,b)=>b.at-a.at).map(e=>`<li><div><b>${e.note.replace(/</g,"&lt;")}</b><small>${e.cat} · ${new Date(e.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</small></div><div style="display:flex;align-items:center;gap:6px"><span class="amt ${e.t}">${e.t==="in"?"+":"−"}${tk(e.amount)}</span><button class="del" data-id="${e.id}" aria-label="Delete">×</button></div></li>`).join("");
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{type=b.dataset.t;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b))});
f.onsubmit=e=>{e.preventDefault();items.push({id:Date.now(),t:type,note:note.value.trim(),amount:Math.round(+amount.value),cat:cat.value,at:Date.now()});save();f.reset();draw()};
list.onclick=e=>{const id=e.target.dataset.id;if(id){items=items.filter(x=>x.id!=id);save();draw()}};
reset.onclick=()=>{items=SAMPLE.slice();save();draw()};
draw();
</script>
</body>
</html>
